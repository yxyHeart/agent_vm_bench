# config/common/document-pdf.yaml
# Unified PDF document benchmark config — backend-agnostic (E2B + Docker).
#
# Read by the src kernel (bench_core). The shared stress sections
# (sandbox / create_batch / task_batch / document / test / report /
# workflow_type) load into KernelConfig; the matching backend block
# (e2b: or docker:) loads into its provider Config. Pick with --provider:
#
#   bench-core --provider docker --config config/common/document-pdf.yaml --create-only
#   bench-core --provider e2b    --config config/common/document-pdf.yaml --create-only
#
# Validate without any SDK (parses shared sections + loads recipe only):
#   bench-core --provider fake --config config/common/document-pdf.yaml --create-only -n 1
#
# Document readiness is `document-bench-validate` (exit 0) — a command probe,
# not a port scan. The scene recipe JSON lives in the repo
# (dockerfile_build/document/assets/operations/), so run from a repo checkout,
# not a PyPI install. For XLSX, copy this file and set document.case_kind: xlsx
# (the same image + recipe layout handle both).

workflow_type: document

# === backend blocks (one per provider; only the matching one is read) ===
e2b:
  template: "openclaw-document-v1"
  create_timeout: 86400
  # NUMA node(s) to bind sandboxes to. null/omit = no binding.
  numa_bind: 2
  sandbox_ids_file: "sandboxs_document_pdf.txt"   # save/load IDs across runs (empty = disabled)
  env:                                            # E2B SDK env vars; key/token fall back to ~/.e2b/config.json
    E2B_ACCESS_TOKEN: "your_e2b_access_token_here"
    E2B_API_KEY: "your_e2b_api_key_here"
    E2B_DOMAIN: "e2b.app"
    E2B_API_URL: "http://localhost:3000"
    E2B_HTTP_SSL: "false"

docker:
  image: "ubuntu-document-bench:pdf-opt"           # document image with PIL fast PNG (compress_level=1)
  container_prefix: "doc-bench-pdf"                # Container name prefix (doc-bench-pdf-1, ...)
  cpu_limit: 2.0                                   # CPU limit per container (--cpus)
  memory_limit: "4g"                               # Memory limit per container (-m); LibreOffice recalc is memory-heavy
  create_timeout: 300                              # Container creation timeout (seconds)
  # Readiness = run `document-bench-validate` via exec until exit 0.
  # Workflow-owned by ReadyChecker; no port_check block here. See src/env_provider/_ready.py.

# === shared stress sections (all -> KernelConfig) ===
sandbox:                            # shared sandbox control (creation mode)
  total_count: 10                    # Total sandbox count (creation mode)
  detect_existing: false            # Detect existing sandboxes instead of creating new ones
  create_only: false                # Create sandboxes only without running tasks (Phase 0)

# Sandbox creation batch control (optional, full concurrent if not configured).
create_batch:
  size: 10                          # Sandboxes per batch during creation
  interval: 3                       # Interval between creation batches (seconds)

# Task execution batch control (optional, full concurrent if not configured).
task_batch:
  size: 5                           # Sandboxes to start tasks per batch
  interval: 5                       # Interval between task batches (seconds)

# Document task configuration (case_kind selects seed_dir + workspace_dir layout).
document:
  case_kind: "pdf"                  # "pdf" or "xlsx" (both baked into the same image)
  # recipe_path: omitted -> default dockerfile_build/document/assets/operations/pdf_key_operations.json
  operation_timeout: 300            # Per-tool-call timeout (seconds)
  recalc_timeout: 180               # __DOCUMENT_RECALC_TIMEOUT__ placeholder (seconds)
  task_timeout: 900                 # Whole-task deadline (seconds)
  interval_min: 3.0                 # Inter-task interval minimum (seconds)
  interval_max: 10.0                # Inter-task interval maximum (seconds)

# Test run configuration
test:
  duration: 160                     # Test duration (seconds)
  stats_interval: 10                # Stats snapshot interval (seconds)
  benchmark_percent: 1.0            # Fraction of sandboxes for benchmark (1.0 = 100%, 0.5 = 50%)
  benchmark_mode: "round_robin"     # "fixed" (default) or "round_robin"
  round_size: 5                     # Sandboxes per round (group_count = ceil(total / round_size))
  round_count: 20                   # Max number of rounds
  round_interval: 3                 # Round interval in seconds

# Report configuration
report:
  output_dir: "results/document/pdf"
  filename_prefix: "document_pdf_bench"
